appId: com.electron.app
productName: 截屏解题助手
directories:
  buildResources: build
beforePack: ./scripts/check-ocr-assets.cjs
files:
  - out/**
  - resources/icon.png
  - package.json
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/*/!(${arch})/**'
extraResources:
  - from: resources/ocr
    to: ocr
asarUnpack:
  - resources/**
  - node_modules/onnxruntime-node/bin/**
  - node_modules/@napi-rs/canvas*/**
win:
  executableName: 截屏解题助手
  extraResources:
    - from: resources/ocr-runtime/win32/${arch}
      to: app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/win32/${arch}
      filter:
        - '*.dll'
        - 'LICENSE*.rtf'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  publish: null  # 关闭 macOS 自动更新功能
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  # macOS 只构建 CI runner 所在架构（arm64），文件名带上架构避免误下载
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: 12owo21
  repo: interview-coder
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
