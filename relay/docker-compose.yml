services:
  relay:
    build: .
    image: interview-coder-relay
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      # From .env next to this file; see README.md
      RELAY_KEY: ${RELAY_KEY:?RELAY_KEY is not set, see README.md}
      MAX_VIEWERS: ${MAX_VIEWERS:-10}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
